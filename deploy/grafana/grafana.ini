; Grafana config for the self-healing observability console
; (JOB-731 observability v1). Installed to /etc/grafana/grafana.ini by
; init.sh, which replaces the __CONSOLE_DOMAIN__ placeholder with the
; console_domain Terraform var.
;
; The admin password is deliberately NOT in this file. init.sh seeds it as
; GF_SECURITY_ADMIN_PASSWORD in a root-only systemd EnvironmentFile
; (/etc/grafana/self-healing-admin.env) rendered from Secret Manager, so the
; plaintext never lands in a repo-committed or world-readable file. Env vars
; override ini, so that is the source of truth for the password.

[server]
; Public URL — Caddy terminates TLS and proxies to Grafana on localhost:3000.
root_url = https://__CONSOLE_DOMAIN__
; Served at the domain root, not a sub-path.
serve_from_sub_path = false

[users]
; No self-service signup — accounts are admin-managed (v1) / SSO (v2).
allow_sign_up = false

[auth.anonymous]
; Console is behind Grafana auth; no anonymous access.
enabled = false

; ---------------------------------------------------------------------------
; Google OAuth — v2 follow-up (v1 is admin-login only). The owner supplies an
; OAuth client (authorized redirect: https://__CONSOLE_DOMAIN__/login/google)
; and stores its id/secret in the Secret Manager names wired via the
; grafana_google_oauth_* Terraform vars. init.sh will then render them into
; the systemd EnvironmentFile as GF_AUTH_GOOGLE_CLIENT_ID /
; GF_AUTH_GOOGLE_CLIENT_SECRET and this block gets uncommented:
;
; [auth.google]
; enabled = true
; allow_sign_up = true
; scopes = openid email profile
; auth_url = https://accounts.google.com/o/oauth2/v2/auth
; token_url = https://oauth2.googleapis.com/token
; api_url = https://openidconnect.googleapis.com/v1/userinfo
; allowed_domains = joblander.app
; ---------------------------------------------------------------------------
