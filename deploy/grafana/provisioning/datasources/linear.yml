apiVersion: 1

datasources:
  - name: Linear
    uid: linear
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      auth_method: apiKey
      apiKeyKey: Authorization
      apiKeyType: header
      allowedHosts:
        - https://api.linear.app
    secureJsonData:
      apiKeyValue: $LINEAR_API_KEY
