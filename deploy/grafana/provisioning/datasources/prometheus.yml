# Grafana datasource provisioning (JOB-731 observability v1).
# Installed to /etc/grafana/provisioning/datasources/prometheus.yml.
# The local Prometheus is the default (and only) datasource.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
