name: Terraform

on:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: terraform fmt -check
        run: |
          terraform fmt -check -recursive -diff
          terraform -chdir=../../consumers/joblander/terraform fmt -check -diff
      - name: validate module (self-healing-vm)
        run: |
          terraform -chdir=modules/self-healing-vm init -backend=false -input=false
          terraform -chdir=modules/self-healing-vm validate
      - name: validate root (self-healing)
        run: |
          terraform -chdir=self-healing init -backend=false -input=false
          terraform -chdir=self-healing validate
      - name: validate existing consumer migration
        run: |
          terraform -chdir=../../consumers/joblander/terraform init -backend=false -input=false
          terraform -chdir=../../consumers/joblander/terraform validate
