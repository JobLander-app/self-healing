# CI for the self-healing loop.
#
# Every package that ships to the VM is built here. This is the gate that makes
# pull-based CD safe: deploy/bin/self-healing-deploy.sh trusts origin/main
# blindly, so origin/main must never carry code that fails to compile.
#
# Until 2026-07-28 only the watcher was built — the dispatcher, the component
# that autonomously merges to production repos, had no CI at all.
name: CI

on:
  pull_request:

# Least privilege by default: these jobs only build and test. A compromised
# action or npm lifecycle script must not inherit repo/org write defaults.
permissions:
  contents: read

jobs:
  watcher:
    name: watcher (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: watcher/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test

  dispatcher:
    name: dispatcher (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dispatcher/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        # The dispatcher had no tests until 2026-07-31, which is how a check
        # against a message type the SDK does not have survived 143 runs
        # producing zero trace events without anyone noticing.
        run: npm test

  change-ingest:
    name: change-ingest (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: change-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: change-ingest/package-lock.json
      - name: Install
        # better-sqlite3 is native; ubuntu-latest carries the toolchain.
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test

  monitor:
    name: monitor (python lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (syntax check)
        run: python3 -m py_compile monitor/triage.py
      - name: Unit tests
        run: python3 -m unittest discover -s monitor -p "test_*.py" -v

  deploy-script:
    name: deploy script (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # This script runs as root and restarts production services — an
        # unquoted expansion in it is an outage, so it gets linted like code.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Every root-run script under deploy/bin, not just the CD one: the
          # hardening and netwatch scripts can restart networking and reboot
          # the host, so a quoting bug in them is an outage too.
          shellcheck deploy/bin/*.sh infra/terraform/self-healing/apply.sh

  watchdog:
    name: watchdog (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: watchdog/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        # The watchdog can power-cycle a production VM. Its policy (when to
        # page, when to reset, when to refuse) is pure and fully covered here,
        # including the two guards that keep it from becoming the outage:
        # never reset on a signal it has never seen, and never exceed the
        # reset budget.
        run: npm test

  units:
    name: systemd units (verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: systemd-analyze verify
        # Catches directives systemd silently ignores. StartLimitIntervalSec was
        # shipped under [Service] on 2026-09-02, where systemd logs "Unknown key
        # name ... ignoring" and keeps the default — the guard read as present in
        # the file and was not in effect.
        run: |
          set -uo pipefail

          # A guard that cannot fail is not a guard. Prove the detection works
          # before trusting a clean result: feed systemd-analyze the exact
          # mistake this job exists to catch and require it to complain.
          command -v systemd-analyze >/dev/null 2>&1 \
            || { echo "::error::systemd-analyze is not installed — this job would pass by doing nothing"; exit 1; }
          probe="$(mktemp -d)/probe.service"
          printf '[Unit]\nDescription=probe\n[Service]\nExecStart=/bin/true\nStartLimitIntervalSec=0\n' >"$probe"
          if ! systemd-analyze verify "$probe" 2>&1 | grep -qi 'Unknown key name'; then
            echo "::error::self-test failed: systemd-analyze no longer reports a misplaced directive, so this job proves nothing"
            exit 1
          fi

          set +e
          out="$(systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer deploy/systemd/*.slice 2>&1)"
          rc=$?
          set -e
          echo "$out"

          if grep -Ei 'Unknown key name|Unknown lvalue|Unknown section' <<<"$out"; then
            echo "::error::systemd would ignore the directive(s) above — wrong section or spelling"
            exit 1
          fi

          # The one diagnostic this repo tolerates: the runner is not the VM, so
          # the ExecStart binaries genuinely are absent. Everything else — and
          # any failure with no output at all — is a real finding, not noise.
          # `|| true`: when nothing unexpected remains, the filter chain finds
          # no lines and exits non-zero, which under `bash -e` would fail the
          # step on a CLEAN result. Guarding only the filter, never the verify.
          unexpected="$(grep -v 'is not executable: No such file or directory' <<<"$out" | grep -v '^[[:space:]]*$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected systemd-analyze diagnostics:"
            echo "$unexpected"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ -z "$out" ]; then
            echo "::error::systemd-analyze exited $rc with no output"
            exit 1
          fi
